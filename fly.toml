app = 'todo-app-qo0mbg'
primary_region = 'ams'

[build]

[env]
  PORT = '8000'

[[mounts]]
  source = 'todo_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
