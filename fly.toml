# Fly.io app configuration.
# Replace `app` with a globally-unique name before deploying (or let
# `fly launch` generate one for you).
app = "todo-app-changeme"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "todo_data"
  destination = "/data"
